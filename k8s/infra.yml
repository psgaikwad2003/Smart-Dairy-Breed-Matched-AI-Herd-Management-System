apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdairy-postgres
  labels:
    app: smartdairy
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartdairy
      component: postgres
  template:
    metadata:
      labels:
        app: smartdairy
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: smartdairy
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: smartdairy-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartdairy-secrets
                  key: SPRING_DATASOURCE_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: smartdairy-postgres
spec:
  selector:
    app: smartdairy
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdairy-redis
  labels:
    app: smartdairy
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartdairy
      component: redis
  template:
    metadata:
      labels:
        app: smartdairy
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: smartdairy-redis
spec:
  selector:
    app: smartdairy
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
