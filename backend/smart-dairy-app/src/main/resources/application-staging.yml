# ===================================================================
# Smart Dairy — STAGING Profile
# ===================================================================

spring:
  config:
    activate:
      on-profile: staging

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartdairy_staging}
    username: ${DB_USERNAME:smartdairy}
    password: ${DB_PASSWORD:changeme}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    show-sql: false

logging:
  level:
    com.smartdairy: INFO
